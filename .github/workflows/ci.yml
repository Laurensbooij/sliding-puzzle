name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The storybook Vitest project scans stories in real Chromium (a11y gate).
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Generated files must match their sources. Both are committed (nothing in
      # CI can regenerate them on demand), so drift is invisible without a check.
      - name: Design tokens are up to date
        run: |
          pnpm tokens
          git diff --exit-code --stat src/styles/tokens.css \
            || { echo '::error::tokens.css is stale — run `pnpm tokens` and commit the result.'; exit 1; }
      - name: Extracted messages are up to date
        run: |
          pnpm i18n:extract
          git diff --exit-code --stat src/lib/i18n/locales/en.json \
            || { echo '::error::en.json is stale — run `pnpm i18n:extract` and commit the result.'; exit 1; }

  chromatic:
    # Visual regression via Chromatic; needs full history for TurboSnap.
    #
    # Runs on main as well as on PRs, and it has to. Chromatic finds a baseline
    # by walking git ancestry, and PRs here squash-merge — which discards the
    # branch commits an approval was recorded against and writes one new commit
    # on main with no link back to them. With main unbuilt there was nothing to
    # walk back to, so every PR re-reported the whole Storybook as changed no
    # matter how many times those snapshots had already been accepted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          # Only on main, where every snapshot has already been reviewed on the
          # PR that introduced it. PRs still require a human to accept.
          autoAcceptChanges: main
