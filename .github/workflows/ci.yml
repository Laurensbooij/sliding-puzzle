name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push has nothing left to prove, so drop it rather than let it run
# the branch out. Never on main: those builds are what seed Chromatic's accepted
# baselines, and cancelling one leaves a gap every later PR diffs against.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The storybook Vitest project scans stories in real Chromium (a11y gate).
      #
      # Keyed on Playwright's own version rather than the lockfile hash: the
      # browser build only moves when Playwright does, so any other dependency
      # bump would throw away a good cache for nothing.
      - id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # No `--with-deps`. ubuntu-24.04 already carries every library Chromium
      # links against — the flag installed nine packages and all nine were
      # fonts, 21 MB fetched at 50 kB/s from the Ubuntu mirror, seven minutes
      # every run. Nothing renders from a system font here: the UI is English
      # and Dutch, self-hosting its faces via @fontsource. A story that ever
      # needs CJK should add that one package, not the whole bundle back.
      - run: pnpm exec playwright install chromium
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Generated files must match their sources. Both are committed (nothing in
      # CI can regenerate them on demand), so drift is invisible without a check.
      - name: Design tokens are up to date
        run: |
          pnpm tokens
          git diff --exit-code --stat src/styles/tokens.css \
            || { echo '::error::tokens.css is stale — run `pnpm tokens` and commit the result.'; exit 1; }
      - name: Extracted messages are up to date
        run: |
          pnpm i18n:extract
          git diff --exit-code --stat src/lib/i18n/locales/en.json \
            || { echo '::error::en.json is stale — run `pnpm i18n:extract` and commit the result.'; exit 1; }

  chromatic:
    # Visual regression via Chromatic; needs full history for TurboSnap.
    #
    # Runs on main as well as on PRs, and it has to. Chromatic finds a baseline
    # by walking git ancestry, and PRs here squash-merge — which discards the
    # branch commits an approval was recorded against and writes one new commit
    # on main with no link back to them. With main unbuilt there was nothing to
    # walk back to, so every PR re-reported the whole Storybook as changed no
    # matter how many times those snapshots had already been accepted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          # Only on main, where every snapshot has already been reviewed on the
          # PR that introduced it. PRs still require a human to accept.
          autoAcceptChanges: main
